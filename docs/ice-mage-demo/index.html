<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Ice Mage - Wave Attack Workbench (example)</title>
<style>
  body { margin: 0; background: #0d1620; color: #d8f1ff; font-family: system-ui, sans-serif; }
  .wrap { display: flex; gap: 16px; padding: 16px; box-sizing: border-box; height: 100vh; }
  .stage { flex: 1; display: flex; align-items: center; justify-content: center; }
  canvas { background: linear-gradient(#14283a, #0a1622); border-radius: 8px; }
  .panel { width: 240px; overflow-y: auto; max-height: calc(100vh - 32px); background: #112233; padding: 12px; border-radius: 8px; }
  .panel h2 { font-size: 16px; margin: 4px 0 12px; }
  label { display: block; font-size: 13px; margin-top: 10px; }
  input[type=range] { width: 100%; }
  .val { float: right; color: #8fd8ff; }
  .preset { font-size: 13px; color: #8fd8ff; margin-top: 14px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="stage"><canvas id="c" width="640" height="420"></canvas></div>
  <div class="panel">
    <h2>Ice wave controls</h2>
    <label>Count <span class="val" id="v-count"></span><input type="range" id="count" min="1" max="7" step="1"></label>
    <label>Spacing <span class="val" id="v-spacing"></span><input type="range" id="spacing" min="20" max="80" step="1"></label>
    <label>Height <span class="val" id="v-height"></span><input type="range" id="height" min="20" max="120" step="1"></label>
    <label>Curve <span class="val" id="v-curve"></span><input type="range" id="curve" min="0" max="1" step="0.05"></label>
    <label>Tilt <span class="val" id="v-tilt"></span><input type="range" id="tilt" min="-30" max="30" step="1"></label>
    <label>Fade <span class="val" id="v-fade"></span><input type="range" id="fade" min="0" max="1" step="0.05"></label>
    <div class="preset" id="preset-name"></div>
  </div>
</div>
<script>
const presets = [
  { name: "ice-wave-v1", count: 3, spacing: 48, height: 36, curve: 0.7, tilt: 12, fade: 0.4 },
  { name: "ice-wave-v2", count: 5, spacing: 36, height: 70, curve: 0.2, tilt: -10, fade: 0.2 },
  { name: "ice-spike-v3", count: 1, spacing: 20, height: 100, curve: 0.9, tilt: 0, fade: 0.1 }
];
const keys = ["count", "spacing", "height", "curve", "tilt", "fade"];
const state = { ...presets[0] };
const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");
const groundY = 360;
const startX = 120;

for (const k of keys) {
  const el = document.getElementById(k);
  el.value = state[k];
  el.addEventListener("input", () => { state[k] = parseFloat(el.value); state.name = "custom"; });
}

function applyState() {
  for (const k of keys) {
    document.getElementById(k).value = state[k];
  }
  for (const k of keys) {
    document.getElementById("v-" + k).textContent = state[k];
  }
  document.getElementById("preset-name").textContent = "Preset: " + state.name;
}

function drawWave(x, h, curve, tilt, alpha) {
  const peakY = groundY - h;
  const bulge = h * (0.5 + curve * 0.5);
  const g = ctx.createLinearGradient(x, groundY, x, peakY);
  g.addColorStop(0, `rgba(120, 210, 255, ${alpha})`);
  g.addColorStop(1, `rgba(230, 250, 255, ${alpha})`);
  ctx.beginPath();
  ctx.moveTo(x, groundY);
  ctx.quadraticCurveTo(x + tilt, groundY - bulge, x + tilt * 1.5, peakY);
  ctx.quadraticCurveTo(x + tilt * 0.5 + 12, groundY - h * 0.4, x + 22, groundY);
  ctx.closePath();
  ctx.fillStyle = g;
  ctx.fill();
  ctx.strokeStyle = `rgba(200, 245, 255, ${alpha})`;
  ctx.lineWidth = 2;
  ctx.stroke();
}

let t0 = performance.now();
let presetIndex = 0;
let lastSwitch = t0;
const from = { ...presets[0] };

function frame(now) {
  const elapsed = now - t0;
  // Switch to the next preset every 2.5 seconds, with a smooth blend
  if (now - lastSwitch > 2500) {
    lastSwitch = now;
    presetIndex = (presetIndex + 1) % presets.length;
    Object.assign(from, state);
    Object.assign(state, presets[presetIndex]);
  }
  const blend = Math.min(1, (now - lastSwitch) / 800);
  const cur = {};
  for (const k of keys) {
    const a = from[k], b = presets[presetIndex][k];
    cur[k] = a + (b - a) * blend;
  }
  if (blend >= 1) {
    for (const k of keys) state[k] = presets[presetIndex][k];
  }
  // Grow animation: waves rise in during the first 600 ms of each cycle
  const grow = Math.min(1, ((now - lastSwitch) % 2500) / 600);

  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.fillStyle = "rgba(160, 220, 255, 0.25)";
  ctx.fillRect(0, groundY, canvas.width, 2);

  for (let i = 0; i < Math.round(cur.count); i++) {
    const x = startX + i * cur.spacing;
    drawWave(x, cur.height * grow, cur.curve, cur.tilt, 1 - cur.fade * 0.5);
  }

  for (const k of keys) state[k] = cur[k];
  applyState();
  requestAnimationFrame(frame);
}

applyState();
requestAnimationFrame(frame);
</script>
</body>
</html>
